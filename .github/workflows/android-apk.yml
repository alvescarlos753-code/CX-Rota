name: CX Rota — Testes e APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Testar motor e compilar APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validar cálculos e extrator de ofertas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/build
          javac -encoding UTF-8 -d tests/build \
            app/src/main/java/com/cxwebstudio/cxrota/OfferEngine.java \
            app/src/main/java/com/cxwebstudio/cxrota/OfferParser.java \
            app/src/main/java/com/cxwebstudio/cxrota/CostModel.java \
            tests/EngineTest.java tests/CostModelTest.java
          java -cp tests/build EngineTest
          java -cp tests/build CostModelTest

      # O runner já possui o Android SDK; evitamos a action que tenta instalar
      # o pacote obsoleto "tools" e causa "Failed to find package 'tools'".
      - name: Preparar Android SDK e API 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK: $SDK_ROOT"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Gerar APK de debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar arquivo instalável (artefato)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CX-Rota-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  web-tests:
    name: Testar simulador web premium
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes JS
        run: node web/test-core.js
